name: Go cache baseline

on:
  push:
    branches: [main]
    paths:
      - '**/*.go'
      - go.mod
      - go.sum
      - .github/scripts/ci_capacity.sh
      - .github/workflows/ci-go-cache.yaml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: go-cache-${{ github.ref }}
  cancel-in-progress: true

jobs:
  seed:
    # Only already-merged source can write the reusable main-branch baseline.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - name: Check out trusted main source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Bound CPU concurrency
        run: |
          capacity="$(bash .github/scripts/ci_capacity.sh)"
          echo "GOMAXPROCS=${capacity}" >> "$GITHUB_ENV"
          echo "CPU concurrency budget: ${capacity}"

      - name: Install pinned Go
        uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore reusable Go compilation baseline
        id: baseline
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: deck-go-baseline-${{ runner.arch }}-1.26.10-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: deck-go-baseline-${{ runner.arch }}-1.26.10-${{ hashFiles('go.sum') }}-

      - name: Compile packages and test dependencies without executing tests
        if: steps.baseline.outputs.cache-hit != 'true'
        # -export fills the build cache; -test includes test package variants.
        # This does not execute test binaries or replace required validation.
        run: go list -deps -test -export ./... > /dev/null
