name: Release acceptance

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 6,18 * * *'
  workflow_call:
    inputs:
      source_sha:
        description: Exact commit the CI repair controller asks to accept, possibly an open repair PR head
        required: false
        default: ''
        type: string
      certification_id:
        description: Certification correlation receipt (not a credential)
        required: false
        default: ''
        type: string
      native_backend:
        required: false
        default: self-hosted
        type: string
  workflow_dispatch:
    inputs:
      native_backend:
        description: Native acceptance backend override
        required: false
        default: self-hosted
        type: choice
        options:
          - self-hosted
          - github
          - auto
          - blacksmith

permissions:
  actions: read
  contents: read

env:
  NOISE_TASKS_REPO: ${{ vars.NOISE_TASKS_REPO }}
  NOISE_SDLC_REPO: ${{ vars.NOISE_SDLC_REPO }}

concurrency:
  # Pushes coalesce: a newer merge supersedes the stale acceptance run.
  # Scheduled and dispatched certifications get a unique group so no
  # merge can cancel them mid-run.
  group: release-acceptance-${{ github.event_name == 'push' && 'push' || github.run_id }}
  cancel-in-progress: true

jobs:
  source:
    runs-on: ${{ github.repository == 'noisefloor-oss/deck' && github.event.repository.visibility == 'public' && 'ubuntu-24.04-arm' || fromJSON('["self-hosted","Linux","ARM64"]') }}
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Bind the certified source
        id: source
        env:
          CANDIDATE: ${{ inputs.source_sha }}
          REQUEST: ${{ inputs.certification_id }}
          SOURCE: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ -n "${CANDIDATE}" ]; then
            test "${EVENT}" = workflow_dispatch
            test "${REF}" = refs/heads/main
            [[ "${CANDIDATE}" =~ ^[0-9a-f]{40}$ ]]
            [[ "${REQUEST}" =~ ^[0-9a-f]{40}$ ]]
            SOURCE="${CANDIDATE}"
          else
            test -z "${REQUEST}"
          fi
          [[ "${SOURCE}" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=${SOURCE}" >>"${GITHUB_OUTPUT}"

  bwrap-proof:
    needs: source
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ github.repository == 'noisefloor-oss/deck' && github.event.repository.visibility == 'public' && 'ubuntu-24.04' || fromJSON('["self-hosted","Linux","X64"]') }}
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ needs.source.outputs.sha }}

      - name: Prove the pinned Bubblewrap executable identity
        run: |
          set -eu
          proof_root="${RUNNER_TEMP}/bwrap-proof-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          install -d -m 0700 "${proof_root}"
          echo "BWRAP_PROOF_ROOT=${proof_root}" >>"${GITHUB_ENV}"
          image="golang:1.26.10-bookworm@sha256:ee3901c61e423732605a51f1b8157c849ec01194ea0a274213b5202b2c11e7bf"
          : > "${proof_root}/amd64"
          for run in 1 2; do
            docker run --rm \
              --volume "${PWD}:/src:Z" --workdir /src \
              --volume "${proof_root}:/proof:Z" \
              --env TMPDIR=/tmp \
              "${image}" deploy/bwrap/build-bwrap.sh amd64 "/proof/build-${run}" \
              | tee -a "${proof_root}/amd64"
          done
          test "$(grep -c 'executable-sha256' "${proof_root}/amd64")" = 2
          # awk emits an unpadded count on both GNU/Linux and macOS runners.
          test "$(grep 'executable-sha256' "${proof_root}/amd64" | awk '{print $3}' | sort -u | awk 'END {print NR}')" = 1
          test "$(grep -c 'rootfs-tar-sha256' "${proof_root}/amd64")" = 2
          test "$(grep 'rootfs-tar-sha256' "${proof_root}/amd64" | awk '{print $3}' | sort -u | awk 'END {print NR}')" = 1
          install -d -m 0700 "${proof_root}/evidence"
          install -m 0444 "${proof_root}/build-1/out/bwrap-amd64.tar" \
            "${proof_root}/evidence/bwrap-amd64-rootfs.tar"
          {
            printf 'bubblewrap-source-archive-sha256  %s\n' \
              '69abc30005d2186baf7737feacd8da35633b93cf5af38838ecff17c5f8e924f6'
            printf 'bubblewrap-executable-sha256  %s\n' \
              "$(grep 'executable-sha256' "${proof_root}/amd64" | head -1 | awk '{print $3}')"
            printf 'bubblewrap-rootfs-tar-sha256  %s\n' \
              "$(grep 'rootfs-tar-sha256' "${proof_root}/amd64" | head -1 | awk '{print $3}')"
          } >"${proof_root}/evidence/SHA256SUMS"
          echo "Bubblewrap linux/amd64 reproduced identically across two clean builds"

      - name: Upload pinned Bubblewrap evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bubblewrap-linux-amd64-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.BWRAP_PROOF_ROOT }}/evidence
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          overwrite: true

      - name: Remove Bubblewrap evidence staging
        if: always()
        run: |
          if [ -z "${BWRAP_PROOF_ROOT:-}" ] || [ ! -d "${BWRAP_PROOF_ROOT}" ]; then
            exit 0
          fi
          image="golang:1.26.10-bookworm@sha256:ee3901c61e423732605a51f1b8157c849ec01194ea0a274213b5202b2c11e7bf"
          docker run --rm --volume "${BWRAP_PROOF_ROOT}:/proof:Z" \
            "${image}" sh -c 'find /proof -mindepth 1 -delete'
          rmdir "${BWRAP_PROOF_ROOT}"


  portable-checks:
    needs: source
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ github.repository == 'noisefloor-oss/deck' && github.event.repository.visibility == 'public' && 'ubuntu-24.04-arm' || fromJSON('["self-hosted","Linux","ARM64"]') }}
    timeout-minutes: 30
    outputs:
      native_backend: ${{ steps.select_native_runner.outputs.backend }}
      native_runner: ${{ steps.select_native_runner.outputs.runner }}

    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ needs.source.outputs.sha }}

      - name: Verify clean checkout
        run: test -z "$(git status --porcelain)"

      - name: Install pinned Go
        uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Install pinned pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 11.18.0
          run_install: false

      - name: Install pinned Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26.12.1

      - name: Check Go formatting
        run: test -z "$(gofmt -l .)"

      - name: Test and build frontend
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm test
          pnpm build

      - name: Verify tests left the checkout clean
        run: test -z "$(git status --porcelain)"

      - name: Select the native acceptance runner
        id: select_native_runner
        env:
          GH_TOKEN: ${{ github.token }}
          NOISEDECK_NATIVE_BACKEND: ${{ github.repository == 'noisefloor-oss/deck' && github.event.repository.visibility == 'public' && 'github' || inputs.native_backend || vars.NOISEDECK_NATIVE_BACKEND || 'self-hosted' }}
        run: deploy/select-native-runner.sh

  native-worker:
    name: ${{ needs.portable-checks.outputs.native_backend == 'blacksmith' && 'blacksmith-linux-amd64-acceptance' || (needs.portable-checks.outputs.native_backend == 'self-hosted' && 'self-hosted-linux-amd64-acceptance' || 'github-hosted-linux-amd64-acceptance') }}
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    needs: [source, portable-checks]
    runs-on: ${{ fromJSON(needs.portable-checks.outputs.native_runner) }}
    timeout-minutes: 60
    env:
      COMPOSE_PROJECT_NAME: deck-ci-${{ github.run_id }}-${{ github.run_attempt }}
      COMPOSE_FILE: compose.yaml
      NOISE_BROWSER_TEST_IMAGE: noise-browser-ci:${{ github.run_id }}
      MEMPALACE_TEST_IMAGE: deck:mempalace-ci-${{ github.run_id }}
      GO_TEST_IMAGE: deck:go-ci-${{ github.run_id }}
      SLIM_TEST_IMAGE: deck:slim-ci-${{ github.run_id }}
      MEMPALACE_HOME_VOLUME: deck-mempalace-home-ci-${{ github.run_id }}-${{ github.run_attempt }}
      NOISEDECK_CI_BACKEND: ${{ needs.portable-checks.outputs.native_backend }}

    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ needs.source.outputs.sha }}

      - name: Require native Linux AMD64
        run: test "$(uname -m)" = x86_64

      - name: Define disposable paths
        run: |
          ci_root="${RUNNER_TEMP}/deck-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          install -d -m 0700 "${ci_root}"
          echo "CI_ROOT=${ci_root}" >>"${GITHUB_ENV}"
          echo "COMPOSE_ENV_FILE=${ci_root}/compose.env" >>"${GITHUB_ENV}"

      - name: Set up bounded Blacksmith BuildKit cache
        if: needs.portable-checks.outputs.native_backend == 'blacksmith' && inputs.source_sha == ''
        uses: useblacksmith/setup-docker-builder@9309da73a81f66976a6d750572e221508b1e2682 # v1
        with:
          max-cache-size-mb: "5120"
          max-parallelism: "4"
          nofallback: "false"
      - name: Remove builder bootstrap artifact and verify clean checkout
        env:
          CANDIDATE: ${{ inputs.source_sha }}
        run: |
          case "${NOISEDECK_CI_BACKEND}" in
            github|self-hosted) ;;
            blacksmith) test -n "${CANDIDATE}" || test -f docker-container-buildkitd.toml ;;
            *) echo "unexpected Linux backend: ${NOISEDECK_CI_BACKEND}" >&2; exit 1 ;;
          esac
          rm -f buildkitd.toml docker-container-buildkitd.toml
          test -z "$(git status --porcelain)"

      - name: Reclaim hosted runner disk before image builds
        if: runner.environment == 'github-hosted' && (runner.os == 'Linux' && needs.portable-checks.outputs.native_backend == 'github')
        run: |
          # The GitHub-hosted Ubuntu image carries ~20 GB of preinstalled
          # toolchains this job never touches. The runtime, browser, and
          # MemPalace image builds plus their BuildKit cache no longer fit
          # alongside them: uv died with ENOSPC extracting the kubernetes
          # wheel during the MemPalace stage. Reclaim the bloat up front.
          df -h /
          sudo rm -rf \
            /usr/local/lib/android \
            /opt/hostedtoolcache \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/share/powershell
          df -h /

      - name: Create disposable Compose fixture
        run: |
          set -eu
          # UID 1000 must traverse the parent and use every bind mount without sudo.
          install -d -m 0711 "${CI_ROOT}"
          install -d -m 0777 \
            "${CI_ROOT}/projects" \
            "${CI_ROOT}/gh" \
            "${CI_ROOT}/mempalace"
          install -d -m 1777 "${CI_ROOT}/tmp"
          # Relabel only disposable CI paths, never the host's machine-id.
          cp /etc/machine-id "${CI_ROOT}/machine-id"
          if [ -e /sys/fs/selinux/enforce ]; then
            chcon -t container_file_t -l s0 deploy/sidecar-resolv.conf
            getfattr -n security.selinux deploy/sidecar-resolv.conf
          fi
          python3 - <<'PYTHON'
          import json, os, pathlib
          root = pathlib.Path(os.environ['CI_ROOT'])
          mounts = [
              ('projects', '/workspace', False),
              ('gh', '/home/agent/.config/gh', False),
              ('machine-id', '/run/noisedeck-host-machine-id', True),
          ]
          overlay = {'services': {'app': {'volumes': [
              {'type': 'bind', 'source': str(root / source), 'target': target,
               'read_only': read_only, 'bind': {'selinux': 'Z'}}
              for source, target, read_only in mounts
          ]}}}
          (root / 'compose-ci.json').write_text(json.dumps(overlay))
          PYTHON
          echo "COMPOSE_FILE=compose.yaml:${CI_ROOT}/compose-ci.json" >>"${GITHUB_ENV}"
          deployment_host_sha256=$(sha256sum /etc/machine-id | awk '{print $1}')
          cat >"${COMPOSE_ENV_FILE}" <<EOF
          NOISEDECK_HOST_PORT=0
          NOISEDECK_IMAGE_TAG=ci-${GITHUB_RUN_ID}
          NOISEDECK_BUILD_VERSION=ci-${GITHUB_RUN_ID}
          NOISEDECK_RUNTIME_UID=1000
          NOISEDECK_RUNTIME_GID=1000
          NOISEDECK_DEPLOYMENT_HOST_SHA256=${deployment_host_sha256}
          NOISEDECK_PUBLIC_ORIGIN=http://127.0.0.1
          NOISEDECK_HOST_ID_PATH=${CI_ROOT}/machine-id
          NOISEDECK_PROJECTS_HOST_PATH=${CI_ROOT}/projects
          NOISEDECK_GH_CONFIG_HOST_PATH=${CI_ROOT}/gh
          NOISEDECK_MEMPALACE_HOST_PATH=${CI_ROOT}/mempalace
          NOISEDECK_TMP_HOST_PATH=${CI_ROOT}/tmp
          EOF

      - name: Verify disposable mount access
        run: |
          image="golang:1.26.10-bookworm@sha256:ee3901c61e423732605a51f1b8157c849ec01194ea0a274213b5202b2c11e7bf"
          docker run --rm --user 1000:1000 \
            --volume "${CI_ROOT}/projects:/workspace:Z" \
            --volume "${CI_ROOT}/gh:/home/agent/.config/gh:Z" \
            --volume "${CI_ROOT}/mempalace:/home/agent/.mempalace:Z" \
            --volume "${CI_ROOT}/tmp:/tmp:Z" \
            --entrypoint sh "${image}" -eu -c '
            for path in /workspace /home/agent/.config/gh /home/agent/.mempalace /tmp; do
              test -w "$path"
              test -x "$path"
            done
            printf "#!/bin/sh\necho mount-access-ok\n" >/tmp/probe
            chmod 0755 /tmp/probe
            test "$(/tmp/probe)" = mount-access-ok
            rm /tmp/probe
          '

      - name: Validate Compose configuration
        run: |
          docker compose --env-file "${COMPOSE_ENV_FILE}" config --quiet
          docker compose --env-file "${COMPOSE_ENV_FILE}" \
            --file compose.yaml --file compose.browser.yaml \
            config --quiet

      - name: Validate the production capability profile
        env:
          NOISEDECK_PUBLIC_ORIGIN: https://deck.example.invalid
          NOISEDECK_PUBLISH_ADDRESS: 127.0.0.1
          GOOGLE_OIDC_CLIENT_ID: acceptance.apps.googleusercontent.com
          GOOGLE_OIDC_CLIENT_SECRET: acceptance-not-a-real-secret
          GOOGLE_OIDC_ALLOWED_EMAIL: acceptance@example.invalid
          NOISEDECK_AUTH_SESSION_SECRET: acceptance-not-a-real-session-secret
        run: deploy/production-compose.sh "${COMPOSE_ENV_FILE}" config

      - name: Build native runtime as 1000:1000
        run: |
          docker compose --env-file "${COMPOSE_ENV_FILE}" build app
          test "$(docker image inspect "deck:ci-${GITHUB_RUN_ID}" --format '{{.Os}}/{{.Architecture}}')" = linux/amd64

      - name: Start with clean volumes and require readiness
        run: |
          docker compose --env-file "${COMPOSE_ENV_FILE}" down --volumes --remove-orphans
          docker compose --env-file "${COMPOSE_ENV_FILE}" up --detach --wait --wait-timeout 120 app
          docker compose --env-file "${COMPOSE_ENV_FILE}" exec -T app \
            curl --fail --silent --show-error http://127.0.0.1:8837/readyz

      - name: Verify provider configuration ownership
        run: |
          docker compose --env-file "${COMPOSE_ENV_FILE}" exec -T app sh -eu -c '
            test "$(id -u):$(id -g)" = 1000:1000
            command -v jq
            test -w /home/agent/.config
            test "$(stat -c %u:%g /home/agent/.config)" = 1000:1000
            hook=/home/agent/.config/opencode/plugins/noisedeck-provider-hook.js
            test -f "$hook"
            test "$(stat -c %u:%g "$hook")" = 1000:1000
            for provider in claude cline codex command-code devin kimi kilo omp opencode pi; do
              test -x "/usr/local/bin/${provider}"
            done
            opencode --version
          '

      - name: Launch real Chromium sidecar
        run: deploy/browser_sidecar_acceptance.sh

      - name: Scan the built browser image for high and critical vulnerabilities
        run: sh deploy/scan-browser-image.sh "${NOISE_BROWSER_TEST_IMAGE}" "${CI_ROOT}/browser-vulnerabilities.json"

      - name: Retain browser vulnerability findings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-vulnerabilities-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.CI_ROOT }}/browser-vulnerabilities.json
          if-no-files-found: warn

      - name: Verify MemPalace image with a fresh home volume
        run: |
          NOISEDECK_IMAGE_TAG="${MEMPALACE_TEST_IMAGE#deck:}" \
            docker compose --env-file "${COMPOSE_ENV_FILE}" \
              --file compose.yaml --file compose.mempalace.yaml build app
          docker volume create "${MEMPALACE_HOME_VOLUME}"
          trap 'docker volume rm --force "${MEMPALACE_HOME_VOLUME}"' EXIT
          docker run --rm --user 1000:1000 \
            --volume "${MEMPALACE_HOME_VOLUME}:/home/agent" \
            --entrypoint sh "${MEMPALACE_TEST_IMAGE}" -eu -c '
              test "$(stat -c %u:%g /home/agent/.cache)" = 1000:1000
              test -w /home/agent/.cache
              test "$(mempalace --version)" = "MemPalace 3.10.0"
              command -v node
              command -v jq
              ps -p $$ -o pid=
              ! command -v go
              opencode --version
            '

      - name: Build the Go-derived MemPalace image and verify both capabilities
        run: |
          NOISEDECK_IMAGE_TAG="${GO_TEST_IMAGE#deck:}" \
            docker compose --env-file "${COMPOSE_ENV_FILE}" \
              --file compose.yaml \
              --file compose.mempalace.yaml \
              --file compose.go.yaml \
              --file compose.go-mempalace.yaml build app
          docker run --rm --user 1000:1000 --entrypoint sh "${GO_TEST_IMAGE}" -eu -c '
            test "$(mempalace --version)" = "MemPalace 3.10.0"
            command -v jq
            test "$(command -v go)" = /usr/local/go/bin/go
            test "$(/bin/bash -lc "command -v go")" = /usr/local/go/bin/go
            test "$(go version | awk "{print \$3}")" = go1.26.10
            test "$(go env GOTOOLCHAIN)" = local
            test ! -w /usr/local/go/bin/go
            command -v cc
          '

      - name: Qualify native login against the built runtime packages
        shell: bash
        run: |
          set -euo pipefail
          probe_dir="${CI_ROOT}/native-login"
          install -d -m 0700 "${probe_dir}"
          # Archive excludes checkout credentials and Git metadata. Compile
          # with the pinned Go image, then run only the binary without network.
          git archive HEAD | docker run --rm -i --user "$(id -u):$(id -g)" \
            --volume "${probe_dir}:/out:Z" \
            --env GOCACHE=/tmp/go-build --env GOPATH=/tmp/go \
            --entrypoint sh "${GO_TEST_IMAGE}" -eu -c '
              mkdir /tmp/source
              tar -xf - -C /tmp/source
              cd /tmp/source
              go test -c -o /out/native-login.test ./internal/harnesslogin
            '
          docker run --rm --network none --cap-drop ALL \
            --security-opt no-new-privileges --cpus 2 --memory 1g --pids-limit 256 \
            --volume "${probe_dir}/native-login.test:/opt/native-login.test:ro,Z" \
            --env NOISEDECK_TEST_CODEX_EXECUTABLE=/usr/local/bin/codex \
            --env NOISEDECK_TEST_PI_EXECUTABLE=/usr/local/bin/pi \
            --entrypoint /opt/native-login.test "deck:ci-${GITHUB_RUN_ID}" \
            -test.run '^TestNative(Codex|Pi)BrowserRegistration$' -test.v -test.count=1 \
            | tee "${probe_dir}/results.txt"
          if grep -q -- '--- SKIP:' "${probe_dir}/results.txt"; then
            echo 'Native login qualification skipped a probe' >&2
            exit 1
          fi
          for test in TestNativeCodexBrowserRegistration \
            TestNativePiBrowserRegistration/anthropic \
            TestNativePiBrowserRegistration/openai-codex; do
            grep -Eq "^[[:space:]]*--- PASS: ${test} [(]" "${probe_dir}/results.txt"
          done

      - name: Build the slim image and verify what it contains
        run: |
          NOISEDECK_IMAGE_TAG="${SLIM_TEST_IMAGE#deck:}" \
            docker compose --env-file "${COMPOSE_ENV_FILE}" \
              --file compose.yaml --file compose.slim.yaml build app
          test "$(docker image inspect "${SLIM_TEST_IMAGE}" --format '{{.Config.User}}')" = 1000:1000
          test "$(docker image inspect "${SLIM_TEST_IMAGE}" --format '{{json .Config.Entrypoint}}')" \
            = "$(docker image inspect "deck:ci-${GITHUB_RUN_ID}" --format '{{json .Config.Entrypoint}}')"
          test "$(docker image inspect "${SLIM_TEST_IMAGE}" --format '{{json .Config.Cmd}}')" \
            = "$(docker image inspect "deck:ci-${GITHUB_RUN_ID}" --format '{{json .Config.Cmd}}')"
          docker run --rm --user 1000:1000 --entrypoint sh "${SLIM_TEST_IMAGE}" -eu -c '
            for required in claude codex gh git jq node ps python3 rg tmux tini \
              noise noise-deck noisedeck-bootstrap noisedeck-provision \
              noisedeck-auth-mode-healthcheck; do
              command -v "$required" >/dev/null || {
                echo "slim image is missing ${required}" >&2; exit 1; }
            done
            for excluded in go gcc cc bun mempalace cline command-code crush \
              cursor-agent devin grok kimi kilo mimo omp opencode pi qoder qwen; do
              if command -v "$excluded" >/dev/null 2>&1; then
                echo "slim image unexpectedly contains ${excluded}" >&2; exit 1
              fi
            done
            test ! -d /usr/local/go
            claude --version
            codex --version
            ps -p $$ -o pid=
            noise deck version
            test "$(noise plugins)" = "$(printf "deck\nsdlc\ntasks\nvisual-diff")"
          '

      - name: Report image variant sizes
        run: |
          full=$(docker image inspect "deck:ci-${GITHUB_RUN_ID}" --format '{{.Size}}')
          slim=$(docker image inspect "${SLIM_TEST_IMAGE}" --format '{{.Size}}')
          {
            echo '### Image variant sizes'
            echo
            echo '| Variant | Target | Size | Delta |'
            echo '| --- | --- | ---: | ---: |'
            printf '| deck:latest | `runtime` | %s | baseline |\n' \
              "$(numfmt --to=iec --suffix=B -- "${full}")"
            printf '| deck:slim | `slim` | %s | -%s (-%s%%) |\n' \
              "$(numfmt --to=iec --suffix=B -- "${slim}")" \
              "$(numfmt --to=iec --suffix=B -- "$((full - slim))")" \
              "$(( (full - slim) * 100 / full ))"
          } >>"${GITHUB_STEP_SUMMARY}"
          # A slim image that stopped being smaller means a harness or a
          # toolchain leaked into the shared core.
          test "${slim}" -lt "${full}"

      - name: Preserve failure diagnostics
        if: failure()
        run: |
          if test -f "${COMPOSE_ENV_FILE}"; then
            docker compose --env-file "${COMPOSE_ENV_FILE}" ps --all || true
            docker compose --env-file "${COMPOSE_ENV_FILE}" logs --no-color app || true
          fi

      - name: Remove disposable acceptance state
        if: always()
        run: |
          if test -f "${COMPOSE_ENV_FILE}"; then
            docker compose --env-file "${COMPOSE_ENV_FILE}" down --volumes --remove-orphans || true
          fi
          docker image rm "${NOISE_BROWSER_TEST_IMAGE}" || true
          docker volume rm --force "${MEMPALACE_HOME_VOLUME}" || true
          docker image rm "${MEMPALACE_TEST_IMAGE}" || true
          docker image rm "${GO_TEST_IMAGE}" || true
          docker image rm "${SLIM_TEST_IMAGE}" || true
          docker image rm "deck:ci-${GITHUB_RUN_ID}" || true
          case "${CI_ROOT:-}" in
            "${RUNNER_TEMP}"/deck-ci-*) rm -rf -- "${CI_ROOT}" ;;
            "") ;;
            *) echo "refusing to remove unexpected CI_ROOT: ${CI_ROOT}" >&2; exit 1 ;;
          esac

  native-linux-amd64:
    name: native-linux-amd64
    if: >-
      always() && !cancelled() &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    needs: [portable-checks, bwrap-proof, native-worker]
    runs-on: ${{ github.repository == 'noisefloor-oss/deck' && github.event.repository.visibility == 'public' && 'ubuntu-24.04-arm' || fromJSON('["self-hosted","Linux","ARM64"]') }}
    timeout-minutes: 5
    steps:
      - name: Certify selected native backend
        env:
          BACKEND: ${{ needs.portable-checks.outputs.native_backend }}
          PORTABLE_RESULT: ${{ needs.portable-checks.result }}
          BWRAP_RESULT: ${{ needs.bwrap-proof.result }}
          WORKER_RESULT: ${{ needs.native-worker.result }}
        run: |
          test "${PORTABLE_RESULT}" = success
          test "${BWRAP_RESULT}" = success
          test "${WORKER_RESULT}" = success
          case "${BACKEND}" in
            self-hosted|github|blacksmith) ;;
            *) echo "unexpected backend: ${BACKEND}" >&2; exit 1 ;;
          esac
