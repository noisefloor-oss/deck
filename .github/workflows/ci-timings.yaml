name: CI timings

on:
  workflow_run:
    workflows: [Fast checks, Release acceptance]
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  summarize:
    runs-on: ${{ github.repository == 'noisefloor-oss/deck' && github.event.repository.visibility == 'public' && 'ubuntu-24.04' || fromJSON('["self-hosted","Linux","native-linux"]') }}
    timeout-minutes: 5
    steps:
      - name: Check out trusted default-branch source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Summarize completed run metadata
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ github.event.workflow_run.id }}
          SOURCE_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: python3 -B .github/scripts/job_timings.py --repo "$GITHUB_REPOSITORY" --run "$SOURCE_RUN" --attempt "$SOURCE_ATTEMPT" --output "$RUNNER_TEMP/job-timings.json"
      - name: Save timing metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: job-timings-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          path: ${{ runner.temp }}/job-timings.json
          retention-days: 30
